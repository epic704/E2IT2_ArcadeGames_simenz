<html>
    <head>
        <!-- Zeichensatzkodierung festlegen -->
	    <meta http-equiv="Content Type" content="text/html" charset="utf-8" />
	    <!-- Viewport festlegen -->
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">		
	    <!-- Stylesheet laden -->
        <link rel="stylesheet" href="./css/desian-global-style.css">
	    <link rel="stylesheet" href="./css/Tetris-styles.css" type="text/css" />
	    <!-- Titel festlegen -->
        <title>Tetris</title>
    </head>
  <main class="game">
    <div class="board" aria-label="Tetris Spielfeld">
      <!-- Untere Reihe (Reihe 20) -->
      <div class="cell cyan" style="grid-column: 1; grid-row: 20;"></div>
      <div class="cell cyan" style="grid-column: 2; grid-row: 20;"></div>
      <div class="cell cyan" style="grid-column: 3; grid-row: 20;"></div>
      <div class="cell cyan" style="grid-column: 4; grid-row: 20;"></div>
      <div class="cell yellow" style="grid-column: 5; grid-row: 20;"></div>
      <div class="cell yellow" style="grid-column: 6; grid-row: 20;"></div>
      <div class="cell green" style="grid-column: 8; grid-row: 20;"></div>
      <div class="cell green" style="grid-column: 9; grid-row: 20;"></div>

      <!-- Reihe 19 -->
      <div class="cell yellow" style="grid-column: 5; grid-row: 19;"></div>
      <div class="cell yellow" style="grid-column: 6; grid-row: 19;"></div>
      <div class="cell green" style="grid-column: 7; grid-row: 19;"></div>
      <div class="cell green" style="grid-column: 8; grid-row: 19;"></div>

      <!-- Fallendes T-Tetromino -->
      <div class="cell purple" style="grid-column: 4; grid-row: 4;"></div>
      <div class="cell purple" style="grid-column: 5; grid-row: 4;"></div>
      <div class="cell purple" style="grid-column: 6; grid-row: 4;"></div>
      <div class="cell purple" style="grid-column: 5; grid-row: 5;"></div>
            </div>
        </main>
    </body>
</html>
