<html>
    <head>
        <!-- Zeichensatzkodierung festlegen -->
	    <meta http-equiv="Content Type" content="text/html" charset="utf-8" />
	    <!-- Viewport festlegen -->
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">		
	    <!-- Stylesheet laden -->
	    <link rel="stylesheet" href="styles.css" type="text/css" />		
	    <!-- jQuery laden -->
	    <script charset="utf-8" src='jquery-3.6.0.min.js' type='text/javascript'> </script>
	    <!-- Titel festlegen -->
        <title>Tetris</title>
        <style>
        #spielfeld{
            position: absolute;
	        width: 10px;
	        height: 10px;
            border: 1px solid black;
            background-color: cyan;
        }
    </style>
    </head>
    <body>
        <h1>Wilkommen bei Tetris</h1>
        <hr>
        <p href="./Haupt.html">Zurück auf ArcadeGames</p>
        <button id="play">Spiel starten</button>
        <div id="spielfeld">
            <div id="block1"></div>
            <div id="block2"></div>
        </div>
        <button id="reset">Spielfeld zurücksetzen</button>



        <!-- Javascript-Code -->
<script>
    var spielfeld_x = 800;
    var spielfeld_y = 600;
   

    // Wenn Seite geladen ist
    $(document).ready(function() {
        
    $("#spielfeld").css("width", spielfeld_x + "px").css("height", spielfeld_y + "px");       
        
	})	// end of document.ready
</script>

    </body>
</html>
