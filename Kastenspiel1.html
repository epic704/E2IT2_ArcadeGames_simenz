<!DOCTYPE html>
<html lang="de">
<head>
	<!-- Zeichensatzkodierung festlegen -->
	<meta http-equiv="Content Type" content="text/html" charset="utf-8" />
	<!-- Viewport festlegen -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">		
	<!-- Stylesheet laden -->
	<link rel="stylesheet" href="styles.css" type="text/css" />		
	<!-- jQuery laden -->
	<script charset="utf-8" src='jquery-3.6.0.min.js' type='text/javascript'> </script>
	<!-- Titel festlegen -->
	<title>Seiten-Template</title>
	<style>
	#spielfeld{
	    position: absolute;
	    width: 600px;
	    height: 400px;
	    background-image: url('./images/Spielbild.jpg');
	    border: 1px solid black;
	}
	 #knopf{
	    width: 200px;
	    height: 50px;
	    border: 2px solid blue;
		margin-left: 200px;
		margin-top: 175px;
		border-radius: 10px;
		font-weight: bold;
		font-size: 140%;
	}
	 #ziel{
        width: 100px;
	    height: 46px;
		background-image: url('./images/Sternzerstoerer.png'); 
		display: none;
		position: absolute;
	    animation: animate 4s linear infinite;
		cursor: pointer;
	}
	@keyframes animate{
	  0%{
	    transform: rotateX(-30deg) rotateY(0deg)
	  }
      100%{
	    transform: rotateX(-30deg) rotateY(360deg)
      }	
	}   
	#ergebnis{
	    position: absolute;
		bottom: 0;
		text-align: center;
		margin-bottom: 50px;
		width: 100%;
		border-radius: 10px;
		border: 1px solid black;
		background-color: yellow;
		display: none;
	 }
	#status{
	    width: 600px;
	    height: 30px;
	    background-color: orange;
	    border: 1px solid black;
	}
	</style>
</head>
<body>
<!-- HTML-Code -->
<h1>Actionspiel</h1>
<div id="status"></div>
<div id="spielfeld">
   <button id="knopf">Spiel starten</button>
   <div id="ziel"></div>
   <div id="ergebnis"></div>
</div>


<!-- Javascript-Code -->
<script>
var spielfeld_x=600;
var spielfeld_y=400;
var zielradius=50;
var startzeit;
var stopzeit;
var zaehler;
var spielende=5;
var spielzeit;
var timer1;
var speed1 = 100;
var timer2;
var leben;

function malePunkt(){
    var x=Math.random()*(spielfeld_x - 2 * zielradius);
    var y=Math.random()*(spielfeld_y - 2 * zielradius);
    $("#ziel").css("left",x+"px").css("top",y+"px").show();
    timer2=setTimeout(malePunkt, 2000);
}
function maleStatus(){
    var jetzt=new Date();
    var zwischenzeit=jetzt.getTime();
    var zeit=(zwischenzeit - startzeit)/ 1000;
    var status="Treffer: " + zaehler + " Spielzeit: " + zeit +" Sekunden Leben: " + leben;
    $("#status").html(status);
    timer1=setTimeout(maleStatus,speed1);  
}

// Wenn Seite geladen ist
$(document).ready(function() {

    $("#knopf").click(function(event){
	event.stopPropagation(); 
        $("#knopf").hide();
	    $("#ergebnis").hide();
        var jetzt=new Date();
	    startzeit=jetzt.getTime();
	    zaehler=0;
	    malePunkt();
	    maleStatus();
	    leben = 100;
    })
   
    $("#ziel").click(function(event){
	event.stopPropagation();   // Verhindert das der click auf das Ziel als click auf Spielfeld wargenommen wird
	    zaehler = zaehler + 1;
	    //maleStatus();
	    clearTimeout(timer2);

	    if(zaehler >= spielende){
	        clearTimeout(timer1)
		    $("#ziel").hide();
			var jetzt=new Date();
	        stopzeit=jetzt.getTime();
			spielzeit = (stopzeit - startzeit)/ 1000;
			var erg="Sie haben "+ spielzeit +" Sekunden gebraucht";
		    $("#ergebnis").html(erg).show();
			$("#knopf").show().html("Erneut Spielen");
			
	    }
	    else{
	    //Kasten neu malen
	    malePunkt();
	    }
    });
    $("#spielfeld").click(function(){
	    if(leben == 0){
		    var jetzt=new Date();
	        stopzeit=jetzt.getTime();
			spielzeit = (stopzeit - startzeit)/ 1000;
			var leg="Sie haben "+ spielzeit +" Sekunden überlebt bis sie gestorben sind";
		    $("#ergebnis").html(leg).show();
			$("#knopf").show().html("Erneut Spielen");
			clearTimeout(timer1)
			$("#ziel").hide();
	    }
	    else{
	        leben = leben - 10;
	    }
    })

})	// end of document.ready
</script>

</body>
</html>
